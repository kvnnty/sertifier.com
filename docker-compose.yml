services:
  db:
    image: mongo:7
    container_name: sertifier-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secure@123
      MONGO_INITDB_DATABASE: sertifier
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sertifier-backend
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    depends_on:
      - db
    ports:
      - "8082:8082"
    volumes:
      - ./apps/api:/usr/src/app       # mount source code for dev
      - /usr/src/app/node_modules
    command: pnpm run start:dev

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sertifier-frontend
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8082

volumes:
  mongo_data:
